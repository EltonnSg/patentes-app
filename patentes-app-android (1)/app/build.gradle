plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.patentes.app'
    compileSdk 34

    defaultConfig {
        applicationId "cl.patentes.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Firma fija para que las actualizaciones se instalen encima de la versión anterior sin borrar los datos.
    if (file('debug.keystore').exists()) {
        signingConfigs {
            debug {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Lector de texto de Google que funciona sin conexión (modelo incluido en la app).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'
}
