name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar la firma
        run: base64 -d app/debug.keystore.b64 > app/debug.keystore

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PatentesApp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PatentesApp-apk
          path: PatentesApp.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" PatentesApp.apk \
            --title "Versión ${{ github.run_number }}" \
            --notes "APK de la app de patentes. Descárgalo desde el celular, ábrelo e instálalo."
